# Push a tag like test-pr24 → a debug APK ("HyperFragz Debug") is built and
# published as a GitHub pre-release. The Debug app on Hosni's phone shows
# "Test build N is ready · Install" on its next launch.
#
# The tag's message is the banner's subtitle and the release notes, so write
# what to check: git tag -a test-pr24 -m "New filter chips: check the Notes row".
#
# Signed with the release key (same secrets as release.yml), so every test
# build updates the previous one. Only the newest 5 test builds are kept.
name: Test build

on:
  push:
    tags: ["test-*"]

permissions:
  contents: write

concurrency:
  group: test-build
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/hyperfragz-release.jks
          {
            echo "storeFile=keystore/hyperfragz-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # The run number only goes up, so the app can tell which test build is newer.
      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug -PtestBuild=${{ github.run_number }} -PsignDebug=true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          apk="HyperFragz-Debug-$version-test.$N.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
            notes=--notes-from-tag
          else
            subject=$(git log -1 --format=%s)
            notes="--notes=Built from $(git rev-parse --short HEAD): $subject"
          fi
          gh release create "$GITHUB_REF_NAME" "$apk" --prerelease --latest=false \
            --title "Test build $N · $subject" "$notes"

      - name: Keep the newest 5 test builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("test-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done

      - name: Remove signing key
        if: always()
        run: rm -f keystore/hyperfragz-release.jks keystore.properties
