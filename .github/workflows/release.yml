# Push a tag like v1.2.0 → a signed APK is built and published as a GitHub
# release; the app's Update banner picks it up. The tag must match versionName
# in app/build.gradle.kts. Release notes come from the tag's message
# (git tag -a v1.2.0 -m "…"), or are generated from commits.
#
# Repository secrets: KEYSTORE_BASE64 (base64 of the .jks), STORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/hyperfragz-release.jks
          {
            echo "storeFile=keystore/hyperfragz-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="HyperFragz-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # checkout can leave a lightweight copy of the tag; fetch the real one for its message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then notes=--notes-from-tag; else notes=--generate-notes; fi
          gh release create "$GITHUB_REF_NAME" "$apk" --title "HyperFragz $VERSION" $notes --latest

      - name: Remove signing key
        if: always()
        run: rm -f keystore/hyperfragz-release.jks keystore.properties
