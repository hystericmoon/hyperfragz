# Publishes a signed APK as a GitHub release; the app's Update banner picks it up.
#
# Two ways to release:
#  - Merge a commit that raises versionName in app/build.gradle.kts into main.
#    If no release exists for that version yet, it is tagged vX.Y.Z and published.
#    Release notes are the "## Release notes" section of the merged pull request's
#    description (up to the next "## " heading), plus a changelog link. Without that
#    section they are generated from the merged pull requests' titles. (This is the
#    way from a cloud session, which can't push tags.)
#  - Push a tag like v1.2.0 (it must match versionName). Release notes come from
#    the tag's message (git tag -a v1.2.0 -m "…"), or are generated from commits.
#
# Repository secrets: KEYSTORE_BASE64 (base64 of the .jks), STORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [app/build.gradle.kts]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version"
              exit 1
            fi
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          elif gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v5
        if: env.PUBLISH == 'true'
        with:
          distribution: temurin
          java-version: 21

      # The runner ships the Android SDK; add the platform this app compiles against.
      - name: Android SDK
        if: env.PUBLISH == 'true'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Signing key
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/hyperfragz-release.jks
          {
            echo "storeFile=keystore/hyperfragz-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        if: env.PUBLISH == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="HyperFragz-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # checkout can leave a lightweight copy of the tag; fetch the real one for its message.
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then notes=--notes-from-tag; else notes=--generate-notes; fi
            gh release create "$GITHUB_REF_NAME" "$apk" --title "HyperFragz $VERSION" $notes --latest
          else
            # Notes from the "## Release notes" section of the PR that merged this commit.
            prev=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' > pr-body.md || : > pr-body.md
            python3 .github/release-notes.py pr-body.md > notes.md
            if [ -s notes.md ]; then
              if [ -n "$prev" ]; then
                printf '\n**Full changelog:** %s/%s/compare/%s...v%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$VERSION" >> notes.md
              fi
              notes=(--notes-file notes.md)
            else
              notes=(--generate-notes)
            fi
            # Creates the tag vX.Y.Z on this commit.
            gh release create "v$VERSION" "$apk" --target "$GITHUB_SHA" --title "HyperFragz $VERSION" "${notes[@]}" --latest
          fi

      - name: Remove signing key
        if: always()
        run: rm -f keystore/hyperfragz-release.jks keystore.properties
